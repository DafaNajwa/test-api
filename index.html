<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daphae NJJ Studio — ngobrol dengan Gemini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B0D24; --panel:#12163A; --raise:#1A1F4D; --line:#262C62; --text:#F4F2FF; --mute:#A0A6DA;
  --accent:#FFB86B; --accent-ink:#1A0F05;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;height:100dvh}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.6;display:grid;grid-template-columns:340px minmax(0,1fr);grid-template-rows:minmax(0,1fr);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Sidebar */
aside{background:linear-gradient(180deg,var(--panel),#0E1130);border-right:1px solid var(--line);padding:30px 20px 22px;display:flex;flex-direction:column;gap:26px;overflow-y:auto}
.brand{padding:0 6px}
.mark{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:15px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.04em;transform:rotate(-6deg);transition:background .4s;box-shadow:0 10px 28px -8px var(--accent)}
h1{font-family:var(--display);font-weight:800;font-size:25px;line-height:1;letter-spacing:-.03em}
h1 span{display:block;font-weight:400;font-size:15px;letter-spacing:.01em;color:var(--mute);margin-top:4px}
.sub{color:var(--mute);font-size:14px;margin-top:18px;max-width:28ch}
.personas{display:flex;flex-direction:column;gap:6px}
.p{display:grid;grid-template-columns:46px 1fr;gap:14px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;border-radius:18px;padding:9px 12px;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.p:hover{background:var(--raise);border-color:var(--line)}
.p[aria-pressed=true]{background:var(--c);color:#14122B;box-shadow:0 14px 30px -14px var(--c)}
.p .em{width:46px;height:46px;border-radius:15px;background:color-mix(in srgb,var(--c) 22%,transparent);display:grid;place-items:center;font-size:24px}
.p[aria-pressed=true] .em{background:rgba(255,255,255,.55)}
.p b{font-family:var(--display);font-weight:600;font-size:17px;display:block;line-height:1.15}
.p small{font-size:13px;opacity:.75;display:block;line-height:1.3;margin-top:2px}
.foot{margin-top:auto;padding:0 6px;font-size:12.5px;color:var(--mute)}

/* Chat */
main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;background:
  radial-gradient(800px 380px at 90% -8%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 70%),var(--ink);transition:background .5s}
header{display:flex;align-items:center;gap:16px;padding:20px 40px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--ink) 70%,transparent);backdrop-filter:blur(10px)}
header .em{font-size:30px;width:56px;height:56px;border-radius:18px;background:color-mix(in srgb,var(--accent) 22%,transparent);border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);display:grid;place-items:center}
header h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05;letter-spacing:-.025em}
header p{color:var(--mute);font-size:14px}
header button{margin-left:auto}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 18px;cursor:pointer;font-size:14px;transition:border-color .2s,background .2s}
.ghost:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
#log{flex:1;min-height:0;overflow-y:auto;padding:32px 40px;display:flex;flex-direction:column;gap:22px;scroll-behavior:smooth}
.empty{margin:auto;max-width:540px;text-align:center}
.empty .big{font-size:72px;filter:drop-shadow(0 12px 24px color-mix(in srgb,var(--accent) 50%,transparent))}
.empty h3{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.1;letter-spacing:-.025em;margin:12px 0 8px}
.empty p{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 16px;cursor:pointer;font-size:14px;transition:border-color .2s,transform .2s}
.chip:hover{border-color:var(--accent);transform:translateY(-2px)}
.msg{max-width:min(740px,90%);overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);padding:12px 18px;border-radius:22px 22px 6px 22px;font-weight:500;box-shadow:0 12px 28px -14px var(--accent)}
.msg.m{align-self:flex-start;padding:2px 0 2px 18px;border-left:3px solid var(--accent)}
.msg.err{border-left-color:#FF6B6B;color:#FFB4B4}
.msg img{max-width:240px;border-radius:14px;display:block;margin-bottom:8px}
.msg p+p,.msg ul,.msg pre,.msg h4{margin-top:10px}
.msg ul{padding-left:20px}
.msg h4{font-family:var(--display);font-size:18px}
.msg code{background:rgba(255,255,255,.1);padding:1px 6px;border-radius:6px;font-size:.92em}
.msg pre{background:#070919;border:1px solid var(--line);border-radius:14px;padding:14px;overflow-x:auto;color:var(--text)}
.msg pre code{background:none;padding:0}
.typing::after{content:"▍";animation:b 1s steps(2) infinite;color:var(--accent)}
@keyframes b{50%{opacity:0}}

/* Composer */
form{padding:10px 40px 26px;display:grid;gap:8px}
.thumb{display:none;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.thumb img{height:46px;border-radius:8px}
.row{display:flex;gap:10px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:8px;box-shadow:0 20px 40px -24px #000;transition:border-color .2s,box-shadow .2s}
.row:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
textarea{flex:1;background:transparent;border:0;resize:none;max-height:160px;padding:10px 10px;outline:0}
textarea::placeholder{color:var(--mute)}
.ic{width:44px;height:44px;border-radius:50%;border:0;background:transparent;cursor:pointer;font-size:20px}
.ic:hover{background:var(--line)}
.send{background:var(--accent);color:var(--accent-ink);font-weight:600;border:0;border-radius:18px;padding:0 24px;height:44px;cursor:pointer;transition:filter .2s}
.send:hover{filter:brightness(1.08)}
.send:disabled{opacity:.5;cursor:wait}

@media (max-width:820px){
  body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  aside{border-right:0;border-bottom:1px solid var(--line);padding:14px;gap:10px;max-height:46vh}
  .sub,.p small,.foot{display:none}
  .logo{width:36px;height:36px;font-size:15px;border-radius:12px}
  h1{font-size:20px}
  h1 span{display:inline;margin-left:6px;font-size:14px}
  .personas{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .p{grid-template-columns:auto;min-width:max-content;grid-auto-flow:column;padding:8px 12px;gap:8px;border-color:var(--line)}
  .p .em{width:32px;height:32px;font-size:18px;border-radius:10px}
  header{padding:12px 14px}
  header .em{width:44px;height:44px;font-size:24px;border-radius:14px}
  header h2{font-size:21px}
  #log,form{padding-left:14px;padding-right:14px}
  .msg{max-width:96%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}#log{scroll-behavior:auto}}
</style>
</head>
<body>
<aside>
  <div class="brand">
    <div class="mark">
      <div class="logo" aria-hidden="true">DN</div>
      <h1>Daphae NJJ<span>Studio</span></h1>
    </div>
    <p class="sub">Satu Gemini, lima kepribadian. Pilih lawan bicaramu.</p>
  </div>
  <div class="personas" id="personas" role="group" aria-label="Pilih persona"></div>
  <p class="foot">Didukung Google Gemini</p>
</aside>

<main>
  <header>
    <span class="em" id="hEm"></span>
    <div><h2 id="hName"></h2><p id="hDesc"></p></div>
    <button class="ghost" id="clear" type="button">Obrolan baru</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <div class="thumb" id="thumb"><img id="thumbImg" alt="Gambar terlampir"><span id="thumbName"></span><button class="ghost" type="button" id="rmImg">Hapus</button></div>
    <div class="row">
      <input type="file" id="file" accept="image/*" hidden>
      <button class="ic" type="button" id="attach" aria-label="Lampirkan gambar" title="Lampirkan gambar">📎</button>
      <textarea id="input" rows="1" placeholder="Tulis pesan… (Enter kirim, Shift+Enter baris baru)"></textarea>
      <button class="send" id="send" type="submit">Kirim</button>
    </div>
  </form>
</main>

<script>
const PERSONAS = [
  {id:"nenek",  em:"👵", name:"Nenek Koki",       desc:"Resep, tips dapur, dan nasihat hidup",     c:"#FFB86B",
   sys:"Kamu adalah Nenek Koki, nenek Indonesia yang hangat dan jago masak. Bicara santai dengan sapaan 'Nak' atau 'Cu', sisipkan nasihat hidup singkat, dan beri resep yang jelas dengan takaran. Jawab dalam bahasa Indonesia.",
   ideas:["Aku punya telur, nasi, dan cabai. Masak apa?","Cara bikin rendang yang empuk?"]},
  {id:"dosen",  em:"🎓", name:"Dosen Sinis",      desc:"Penjelasan tajam, jujur, tapi tetap membantu", c:"#7CE3C4",
   sys:"Kamu adalah dosen yang sinis dan sarkastik secara ringan, tapi penjelasanmu selalu akurat, runtut, dan benar-benar membantu. Beri analogi tajam dan akhiri dengan satu pertanyaan untuk menguji pemahaman. Jawab dalam bahasa Indonesia.",
   ideas:["Jelaskan blockchain tanpa istilah teknis","Kenapa langit biru?"]},
  {id:"koder",  em:"🧑‍💻", name:"Si Debugger",     desc:"Kode, error, dan arsitektur",              c:"#8FA2FF",
   sys:"Kamu adalah senior software engineer yang sabar. Jelaskan akar masalah dulu, lalu beri kode yang rapi dalam blok kode, dan sebutkan satu hal yang perlu diwaspadai. Jawab dalam bahasa Indonesia, istilah teknis boleh bahasa Inggris.",
   ideas:["Apa beda let, const, dan var?","Bantu aku bikin fungsi debounce di JS"]},
  {id:"penyair",em:"🪶", name:"Penyair Senja",    desc:"Puisi, pantun, dan caption puitis",        c:"#FF8FB1",
   sys:"Kamu adalah penyair yang lembut dan puitis. Tulis puisi, pantun, atau kalimat indah dengan diksi Indonesia yang segar, hindari klise. Kalau diminta, jelaskan singkat pilihan katamu. Jawab dalam bahasa Indonesia.",
   ideas:["Puisi tentang hujan di Pekanbaru","Pantun untuk teman yang ulang tahun"]},
  {id:"coach",  em:"🚀", name:"Mentor Startup",   desc:"Ide bisnis, strategi, dan validasi",       c:"#F6E36B",
   sys:"Kamu adalah mentor startup yang lugas. Uji ide dengan pertanyaan tajam, tunjukkan risiko terbesar, lalu beri 3 langkah validasi murah yang bisa dilakukan minggu ini. Jawab dalam bahasa Indonesia.",
   ideas:["Aku mau jualan kopi keliling, bagusnya gimana?","Validasi ide aplikasi kasir UMKM"]}
];

const $ = id => document.getElementById(id);
let cur = PERSONAS[0], histories = {}, imgData = null, busy = false;

const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};

/* ---------- Persona ---------- */
function renderPersonas(){
  $("personas").innerHTML = "";
  PERSONAS.forEach(p => {
    const b = document.createElement("button");
    b.className = "p"; b.type = "button"; b.style.setProperty("--c", p.c);
    b.setAttribute("aria-pressed", p.id === cur.id);
    b.innerHTML = `<span class="em">${p.em}</span><span><b>${p.name}</b><small>${p.desc}</small></span>`;
    b.onclick = () => { cur = p; applyPersona(); };
    $("personas").appendChild(b);
  });
}
function applyPersona(){
  document.documentElement.style.setProperty("--accent", cur.c);
  $("hEm").textContent = cur.em; $("hName").textContent = cur.name; $("hDesc").textContent = cur.desc;
  renderPersonas(); renderLog();
}

/* ---------- Render ---------- */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") }
function md(src){
  const parts = esc(src).split(/```/);
  return parts.map((seg,i) => {
    if(i % 2){ return "<pre><code>" + seg.replace(/^[\w-]*\n/,"") + "</code></pre>" }
    const inl = t => t.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|\s)\*([^*\s][^*]*)\*/g,"$1<i>$2</i>");
    const out = []; let list = false;
    seg.split("\n").forEach(line => {
      const li = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/), h = line.match(/^#{1,4}\s+(.*)/);
      if(li){ if(!list){ out.push("<ul>"); list = true } out.push("<li>" + inl(li[1]) + "</li>"); return }
      if(list){ out.push("</ul>"); list = false }
      if(h) out.push("<h4>" + inl(h[1]) + "</h4>");
      else if(line.trim()) out.push("<p>" + inl(line) + "</p>");
    });
    if(list) out.push("</ul>");
    return out.join("");
  }).join("");
}
function bubble(role, html, cls=""){
  const d = document.createElement("div");
  d.className = "msg " + role + " " + cls; d.innerHTML = html;
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight; return d;
}
function renderLog(){
  $("log").innerHTML = "";
  const h = histories[cur.id] || [];
  if(!h.length){
    $("log").innerHTML = `<div class="empty"><div class="big">${cur.em}</div><h3>${cur.name} siap ngobrol</h3><p>${cur.desc}. Mulai dari ide di bawah, atau tulis sendiri.</p><div class="chips"></div></div>`;
    cur.ideas.forEach(t => { const c = document.createElement("button"); c.className = "chip"; c.type = "button"; c.textContent = t; c.onclick = () => { $("input").value = t; $("form").requestSubmit() }; $("log").querySelector(".chips").appendChild(c) });
    return;
  }
  h.forEach(m => {
    const text = m.parts.filter(p => p.text).map(p => p.text).join("\n");
    const img = m.parts.find(p => p.inline_data);
    bubble(m.role === "user" ? "u" : "m", (img ? `<img alt="Gambar terlampir" src="data:${img.inline_data.mime_type};base64,${img.inline_data.data}">` : "") + (m.role === "user" ? esc(text) : md(text)));
  });
}

/* ---------- Gambar ---------- */
$("attach").onclick = () => $("file").click();
$("file").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  if(f.size > 4 * 1024 * 1024){ bubble("m", "Gambar terlalu besar. Pilih yang di bawah 4 MB.", "err"); return }
  const r = new FileReader();
  r.onload = () => {
    imgData = { mime_type: f.type, data: r.result.split(",")[1] };
    $("thumbImg").src = r.result; $("thumbName").textContent = f.name; $("thumb").style.display = "flex";
  };
  r.readAsDataURL(f); e.target.value = "";
};
$("rmImg").onclick = () => { imgData = null; $("thumb").style.display = "none" };

/* ---------- Kirim ke Gemini ---------- */
$("input").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 160) + "px" });
$("input").addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("form").requestSubmit() } });
$("clear").onclick = () => { if(busy) return; histories[cur.id] = []; renderLog() };

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const text = $("input").value.trim();
  if((!text && !imgData) || busy) return;

  const h = histories[cur.id] = histories[cur.id] || [];
  if(!h.length) $("log").innerHTML = "";
  const parts = [];
  if(imgData) parts.push({ inline_data: imgData });
  parts.push({ text: text || "Jelaskan gambar ini." });
  h.push({ role: "user", parts });
  bubble("u", (imgData ? `<img alt="Gambar terlampir" src="data:${imgData.mime_type};base64,${imgData.data}">` : "") + esc(text));
  $("input").value = ""; $("input").style.height = "auto"; $("rmImg").click();

  busy = true; $("send").disabled = true;
  const out = bubble("m", "", "typing"); let full = "";
  try{
    out.innerHTML = "<i>Gemini sedang berpikir…</i>";
    const ac = new AbortController(), to = setTimeout(() => ac.abort(), 90000);
    const chosen = "gemini-3.5-flash-lite";
    const queue = [chosen, "gemini-3.8-flash"].filter((m, i, a) => a.indexOf(m) === i);
    const call = (model, think) => fetch("/api/chat", {
      method: "POST", signal: ac.signal,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model, system_instruction: { parts: [{ text: cur.sys }] }, contents: h,
        ...(think ? { generationConfig: { thinkingConfig: { thinkingLevel: "low" } } } : {}) })
    });
    let res;
    for(const model of queue){
      for(let i = 0; i < 3; i++){
        res = await call(model, true);
        if(res.status === 400) res = await call(model, false);
        if(res.status !== 503 && res.status !== 429) break;
        out.innerHTML = "<i>Server Google sedang sibuk, mencoba lagi (" + model + ")…</i>";
        await new Promise(r => setTimeout(r, 1500 * (i + 1)));
      }
      if(res.ok) break;
      if(res.status !== 503 && res.status !== 429) break;
    }
    if(!res.ok){
      let msg = "Permintaan gagal (" + res.status + ").";
      try{ msg = (await res.json()).error.message }catch(_){}
      throw new Error(msg);
    }
    const rd = res.body.getReader(), dec = new TextDecoder(); let buf = "", raw = "";
    const eat = ln => {
      if(!ln.startsWith("data:")) return;
      try{
        const j = JSON.parse(ln.slice(5));
        const t = (j.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || "").join("");
        if(t){ full += t; out.innerHTML = md(full); out.classList.add("typing"); $("log").scrollTop = $("log").scrollHeight }
      }catch(_){}
    };
    while(true){
      const { done, value } = await rd.read(); if(done) break;
      const chunk = dec.decode(value, { stream: true }); raw += chunk; buf += chunk;
      const lines = buf.split("\n"); buf = lines.pop();
      lines.forEach(eat);
    }
    eat(buf.trim());
    clearTimeout(to);
    out.classList.remove("typing");
    if(!full){ out.textContent = "Gemini tidak memberi teks. Balasan mentah: " + raw.slice(0, 500); out.classList.add("err"); h.pop() }
    else h.push({ role: "model", parts: [{ text: full }] });
  }catch(err){
    h.pop(); out.classList.remove("typing"); out.classList.add("err");
    out.textContent = err.name === "AbortError" ? "Tidak ada respons dalam 90 detik. Coba lagi, atau ganti nama model." : "Gagal: " + err.message;
  }
  busy = false; $("send").disabled = false; $("input").focus();
});

applyPersona();
</script>
</body>
</html>
